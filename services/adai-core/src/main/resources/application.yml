server:
  port: 8080

spring:
  application:
    name: adai-core

  config:
    import: optional:file:.env[.properties]

  # ── 多模态图片上传（L4）──
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ── Phase 2: 文件索引需要数据库时启用 ──
  # datasource:
  #   url: jdbc:mysql://localhost:3306/adaios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  #   username: root
  #   password: root
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #
  # jpa:
  #   hibernate:
  #     ddl-auto: validate
  #   show-sql: false
  #   open-in-view: false
  #   properties:
  #     hibernate:
  #       format_sql: true
  #       dialect: org.hibernate.dialect.MySQLDialect

adai:
  security:
    # 管理端点令牌（REVIEW #127）：保护 /api/v1/admin/** 与 /api/v1/accounts/**。
    # 生产环境必须设置（.env 配 ADAI_ADMIN_TOKEN），未配置时管理端点 fail-closed 返回 503。
    admin-token: ${ADAI_ADMIN_TOKEN:}
    # CORS 来源白名单（逗号分隔 origin pattern）。默认 localhost/127.0.0.1 任意端口；
    # 生产前端若在服务器上，追加其域名（.env 配 ADAI_ALLOWED_ORIGIN_PATTERNS）。
    allowed-origin-patterns: ${ADAI_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  market:
    # K 线主源（2026-08-23 用户确认腾讯优先：东财在生产被限，腾讯稳定；eastmoney 可切回历史主源）
    kline-primary: tencent
    # Phase 2 行情异动主动推送（MarketAlertService）：交易时段轮询持仓，命中阈值写推送事件入 Feed。
    # cron 默认工作日 9-11/13-15 点每 30 分钟；阈值单位=百分比。
    alert:
      loss-threshold: 3.0     # 单日跌幅 ≥3% → 止损预警
      gain-threshold: 5.0     # 单日涨幅 ≥5% → 放飞提示
      break-cost-enabled: true # 现价跌破成本线 → 风控提醒
      poll-cron: 0 */30 9-11,13-15 * * MON-FRI
  ai:
    provider: deepseek  # 唯一实现，API Key 在 .env 中配置
    model: deepseek-v4-pro      # 旗舰推理模型（复盘等深度场景，2026-08-26 模型分层 S-10）
    model-flash: deepseek-v4-flash  # 轻量快模型（问答/记录/意图/简报等高频交互，无长思维链不占 max_tokens）
    vision:
      provider: glm          # 图片理解（多模态 L4），API Key 在 .env 中配置 GLM_API_KEY
      model: glm-4.1v-thinking-flash  # 免费视觉模型（用户资源包），Thinking 输出 <think>/<answer> 解析器已剥壳
  storage:
    base-path: ${ADAI_DATA_DIR:../../data}

  knowledge:
    # G-4（2026-08-16）：trading-engine 交付层 11-context → knowledge/context（FP-P1 修复，三官审查交叉印证）
    trading-engine-path: ${ADAI_TRADING_KNOWLEDGE_PATH:../../os/trading-engine/knowledge/context}
    life-os-path: ${ADAI_LIFE_KNOWLEDGE_PATH:../../os/life-os/11-context}
    project-os-path: ${ADAI_PROJECT_KNOWLEDGE_PATH:../../os/project-os/11-context}
