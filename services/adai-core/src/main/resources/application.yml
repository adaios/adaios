server:
  port: 8080

spring:
  application:
    name: adai-core

  config:
    import: optional:file:.env[.properties]

  # ── 多模态图片上传（L4）+ admin 行情数据包导入（MD17）──
  # 图片单张 <5MB 默认够；admin 上传通达信 .day zip（全 A 盘后 >5MB）需生产
  # .env 放大：ADAI_MAX_FILE_SIZE=512MB / ADAI_MAX_REQUEST_SIZE=520MB。
  servlet:
    multipart:
      max-file-size: ${ADAI_MAX_FILE_SIZE:5MB}
      max-request-size: ${ADAI_MAX_REQUEST_SIZE:6MB}

  # ── Phase 2: 文件索引需要数据库时启用 ──
  # datasource:
  #   url: jdbc:mysql://localhost:3306/adaios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  #   username: root
  #   password: root
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #
  # jpa:
  #   hibernate:
  #     ddl-auto: validate
  #   show-sql: false
  #   open-in-view: false
  #   properties:
  #     hibernate:
  #       format_sql: true
  #       dialect: org.hibernate.dialect.MySQLDialect

adai:
  # OS 根目录。2026-09-14：路径类配置统一显式声明——给环境变量一个明确挂钩，避免
  # 「.env 里配了名字相近的变量，却静默落到相对默认值」（本次 adj-path 事故的形态）。
  # 生产：ADAI_OS_BASE_PATH=/opt/adaios/os
  os-base-path: ${ADAI_OS_BASE_PATH:../../os}
  security:
    # CORS 来源白名单（逗号分隔 origin pattern）。默认 localhost/127.0.0.1 任意端口；
    # 生产前端若在服务器上，追加其域名（.env 配 ADAI_ALLOWED_ORIGIN_PATTERNS）。
    # REVIEW #178（2026-09-02）：admin-token / ADAI_ADMIN_TOKEN 已退役——管理端点鉴权并入
    # 统一登录（AuthFilter：Bearer 会话 + role=admin 门禁，X-Admin-Token 不再使用）。
    allowed-origin-patterns: ${ADAI_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  market:
    # K 线主源（2026-08-23 用户确认腾讯优先：东财在生产被限，腾讯稳定；eastmoney 可切回历史主源）
    kline-primary: tencent
    # 通达信本地数据（2026-08-30：第一优先——全 A 历史、免网络风控；tdx 无数据自动走网络源）
    # 数据目录 = 通达信 vipdoc/ 的 sh/ sz/ 子目录（lday/*.day），生产用 ADAI_TDX_PATH 指定
    tdx-enabled: true
    tdx-path: ${ADAI_TDX_PATH:../../data/market/tdx}
    # K 线域名（RFC 20260923 A 批，2026-09-23）：逗号分隔、按序尝试。
    # 2026-09-22 深夜实测：老域名 web.ifzq.gtimg.cn/appstock/app/fqkline/get 从生产返回
    # 501 + 腾讯 WAF 拦截页（加 UA/Referer 仍 501 = IP 级），而备用域名
    # proxy.finance.qq.com/ifzqgtimg/appstock/app/newfqkline/get 返回有效前复权 K 线
    # → 默认用备用域名；风控再变时改这个环境变量即可，**不必改代码重新部署**。
    tencent-kline-bases: ${ADAI_MARKET_TENCENT_KLINE_BASES:https://proxy.finance.qq.com/ifzqgtimg/appstock/app/newfqkline/get}
    # 新浪 K 线（RFC 20260923 B 批）：K 线链路最后一层兜底（tdx → 腾讯 → 东财 → 新浪）。
    # 「两个网络源同属被风控对象」——2026-09-22 就是腾讯+东财同时挂；关掉即退回改动前行为。
    sina-kline-enabled: ${ADAI_SINA_KLINE_ENABLED:true}
    # 除权因子本地缓存目录（前复权用）。2026-09-14 修复：代码读 adai.market.adj-path，但 yml 未声明
    # → .env 里的 ADAI_ADJ_PATH 不生效，静默落回相对默认值 ../../data/market/adj，按
    # WorkingDirectory=/opt/adaios/backend 解析成 /opt/data/...（不可写）→ 生产全部标的「除权因子读取失败」。
    adj-path: ${ADAI_ADJ_PATH:../../data/market/adj}
    # Phase 2 行情异动主动推送（MarketAlertService）：交易时段轮询持仓，命中阈值写推送事件入 Feed。
    # cron 默认工作日 9-11/13-15 点每 30 分钟；阈值单位=百分比。
    alert:
      loss-threshold: 3.0     # 单日跌幅 ≥3% → 止损预警
      gain-threshold: 5.0     # 单日涨幅 ≥5% → 放飞提示
      break-cost-enabled: true # 现价跌破成本线 → 风控提醒
      poll-cron: 0 */30 9-11,13-15 * * MON-FRI
  ai:
    provider: deepseek  # 唯一实现，API Key 在 .env 中配置
    model: deepseek-v4-pro      # 旗舰推理模型（复盘等深度场景，2026-08-26 模型分层 S-10）
    model-flash: deepseek-v4-flash  # 轻量快模型（问答/记录/意图/简报等高频交互，无长思维链不占 max_tokens）
    vision:
      provider: glm          # 图片理解（多模态 L4），API Key 在 .env 中配置 GLM_API_KEY
      model: glm-4.1v-thinking-flash  # 免费视觉模型（用户资源包），Thinking 输出 <think>/<answer> 解析器已剥壳
  storage:
    base-path: ${ADAI_DATA_DIR:../../data}

  knowledge:
    # G-4（2026-08-16）：trading-engine 交付层 11-context → knowledge/context（FP-P1 修复，三官审查交叉印证）
    trading-engine-path: ${ADAI_TRADING_KNOWLEDGE_PATH:../../os/trading-engine/knowledge/context}
    life-os-path: ${ADAI_LIFE_KNOWLEDGE_PATH:../../os/life-os/11-context}
    # RFC 20260917：project-os 知识源已撤（文件保留在 os/project-os/，但不再注入任何用户上下文）

  push:
    # ── APNs 渠道（RFC 20260913：付费开发者账号后阿呆 app 直连 APNs，不再借 Bark 转达）──
    # 未配 key-path/key-id → 渠道 enabled()=false，静默跳过（同 Bark 未配 key 的先例），
    # Feed 与其它渠道不受影响。凭据一律走 env（.env 权限 640，不进 git）。
    apns:
      enabled: ${ADAI_PUSH_APNS_ENABLED:true}
      # .p8 私钥（Apple 控制台 Keys → APNs Auth Key 下载，只能下一次）——放服务器本地，别进仓库
      key-path: ${ADAI_PUSH_APNS_KEY_PATH:}
      key-id: ${ADAI_PUSH_APNS_KEY_ID:}
      team-id: ${ADAI_PUSH_APNS_TEAM_ID:4G3D37YKSB}
      bundle-id: ${ADAI_PUSH_APNS_BUNDLE_ID:com.adaiadai.adaiApp}
      # 灰度白名单（逗号分隔推送类型；留空 = 全部推送）。第一刀只放「收盘小结 + 复习提醒」
      # 验证链路（配 close-summary,learn-review），验证通过清空即全量，无需改代码
      types: ${ADAI_PUSH_APNS_TYPES:}
      # 两套网关按 token 自带环境选择（侧载=development 签名→sandbox token；TestFlight/上架→production）
      sandbox-host: ${ADAI_PUSH_APNS_SANDBOX_HOST:https://api.sandbox.push.apple.com}
      production-host: ${ADAI_PUSH_APNS_PRODUCTION_HOST:https://api.push.apple.com}

  # ── learn（学习插件）──
  # 2026-09-16 晚间批：图片源是新的花钱点，两个旋钮显式声明出来（原先只活在 @Value 默认值里，
  # 运维看不见也不知道能调）。
  learn:
    # 读图（书页/PPT/讲义）的**单次**输出上限：长书页要逐字抄录，全局 2048 容易截断（P2-learn25）
    image-max-tokens: ${ADAI_LEARN_IMAGE_MAX_TOKENS:4096}
    # 图片整理**每日张数**上限（0 = 不限）。图片是花钱动作（单次最多 3 次 VLM + 1 次 LLM），
    # 给一道轻量日闸：不弹确认、不打断使用，只堵「手指快就能一直烧」（P2-learn26）
    image-daily-limit: ${ADAI_LEARN_IMAGE_DAILY_LIMIT:30}
