server:
  port: 8080

spring:
  application:
    name: adai-core

  config:
    import: optional:file:.env[.properties]

  # ── Phase 2: 文件索引需要数据库时启用 ──
  # datasource:
  #   url: jdbc:mysql://localhost:3306/adaios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  #   username: root
  #   password: root
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #
  # jpa:
  #   hibernate:
  #     ddl-auto: validate
  #   show-sql: false
  #   open-in-view: false
  #   properties:
  #     hibernate:
  #       format_sql: true
  #       dialect: org.hibernate.dialect.MySQLDialect

adai:
  ai:
    provider: ${ADAI_AI_PROVIDER:mock}  # 默认 mock（无需 Key），生产 .env 设 ADAI_AI_PROVIDER=deepseek
    model: deepseek-v4-pro
  storage:
    base-path: ${ADAI_DATA_DIR:../../data}

  knowledge:
    trading-os-path: ${ADAI_TRADING_KNOWLEDGE_PATH:../../os/trading-os/11-context}
    life-os-path: ${ADAI_LIFE_KNOWLEDGE_PATH:../../os/life-os/11-context}
    project-os-path: ${ADAI_PROJECT_KNOWLEDGE_PATH:../../os/project-os/11-context}
