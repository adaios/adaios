server:
  port: 8080

spring:
  application:
    name: adai-core

  config:
    import: optional:file:.env[.properties]

  # ── 多模态图片上传（L4）──
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ── Phase 2: 文件索引需要数据库时启用 ──
  # datasource:
  #   url: jdbc:mysql://localhost:3306/adaios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  #   username: root
  #   password: root
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #
  # jpa:
  #   hibernate:
  #     ddl-auto: validate
  #   show-sql: false
  #   open-in-view: false
  #   properties:
  #     hibernate:
  #       format_sql: true
  #       dialect: org.hibernate.dialect.MySQLDialect

adai:
  ai:
    provider: deepseek  # 唯一实现，API Key 在 .env 中配置
    model: deepseek-v4-pro
    vision:
      provider: glm          # 图片理解（多模态 L4），API Key 在 .env 中配置 GLM_API_KEY
      model: glm-4.1v-thinking-flash  # 免费视觉模型（用户资源包），Thinking 输出 <think>/<answer> 解析器已剥壳
  storage:
    base-path: ${ADAI_DATA_DIR:../../data}

  knowledge:
    trading-os-path: ${ADAI_TRADING_KNOWLEDGE_PATH:../../os/trading-os/11-context}
    life-os-path: ${ADAI_LIFE_KNOWLEDGE_PATH:../../os/life-os/11-context}
    project-os-path: ${ADAI_PROJECT_KNOWLEDGE_PATH:../../os/project-os/11-context}
