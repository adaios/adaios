<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="阿呆阿呆 — Personal AI Operating System">

  <!-- iOS meta tags & icons（PWA 装机批 2026-09-13）
       注：viewport 由 Flutter 引擎运行时注入（main.dart.js 自带
       width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no），
       此处**不再重复声明**，避免与之冲突。
       也刻意不设 viewport-fit=cover：不设时浏览器把整页排在刘海/灵动岛安全区之内，
       SafeArea 补 0 也无害；设了则需引擎读 env(safe-area-inset-*) 补偿，
       Flutter web 支持不确定 → 有内容钻到灵动岛下面的风险。 -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS「添加到主屏幕」后全屏独立运行（iOS < 16.4 只认 apple- 前缀这个名） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="阿呆阿呆">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>阿呆阿呆</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
