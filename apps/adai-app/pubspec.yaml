name: adai_app
description: "阿呆阿呆 — Personal Context Platform"
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.7
  shared_preferences: ^2.3.0
  web: ^1.0.0
  image_picker: ^1.2.3
  # RFC 20260914 L2（登录体验）：token 落系统钥匙串（iOS Keychain / Android EncryptedSharedPreferences）
  flutter_secure_storage: ^9.2.2
  # RFC 20260914 L2：Face ID / Touch ID 作「本地解锁闸」（生物特征永不出设备，凭证仍是会话 token）
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/adaioa-icon-white.png"
