<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="1500" height="1000" fill="#ffffff"/>
  <text x="48" y="52" font-size="27" font-weight="700" fill="#0f172a">Layer 2 · Git Flow 的流</text>
  <text x="48" y="84" font-size="15" fill="#64748b">沿用 L1 的分支线条 —— 一个版本从功能到上线；三类辅助分支可以同时存在，但都汇到 develop</text>

  <defs>
    <marker id="f2v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="f2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="f2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>

  <text x="48" y="187" font-size="18" font-weight="700" fill="#1d4ed8">main</text>
  <text x="48" y="207" font-size="11.5" fill="#94a3b8">生产就绪（原文 master）</text>
  <line x1="200" y1="180" x2="1440" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="260" cy="180" r="8" fill="#2563eb"/>
  <circle cx="1150" cy="180" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1360" cy="180" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <rect x="1126" y="130" width="20" height="20" transform="rotate(45 1136 140)" fill="#16a34a"/>
  <text x="1158" y="134" font-size="12.5" font-weight="600" fill="#15803d">tag 1.0</text>
  <rect x="1336" y="124" width="20" height="20" transform="rotate(45 1346 134)" fill="#dc2626"/>
  <text x="1368" y="129" font-size="12.5" font-weight="600" fill="#b91c1c">tag 1.0.1</text>
  <text x="1044" y="160" font-size="12.5" fill="#1d4ed8">⑥ 合 main + 打 tag</text>
  <text x="1290" y="160" font-size="12.5" fill="#1d4ed8">⑦ hotfix 合 main</text>

  <text x="48" y="297" font-size="18" font-weight="700" fill="#b91c1c">hotfix/1.0.1</text>
  <line x1="1240" y1="290" x2="1420" y2="290" stroke="#fecaca" stroke-width="3"/>
  <line x1="1240" y1="180" x2="1240" y2="290" stroke="#fecaca" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="1240" cy="290" r="8" fill="#dc2626"/><circle cx="1360" cy="290" r="8" fill="#dc2626"/><circle cx="1420" cy="290" r="8" fill="#dc2626"/>
  <path d="M1360,282 L1360,192" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#f2r)"/>
  <path d="M1420,298 L1420,392" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#f2r)"/>
  <text x="1290" y="440" font-size="11.5" fill="#b91c1c">⑧ 合回 develop</text>

  <text x="48" y="407" font-size="18" font-weight="700" fill="#0f766e">develop</text>
  <text x="48" y="427" font-size="11.5" fill="#94a3b8">下个版本的集成分支</text>
  <line x1="200" y1="400" x2="1440" y2="400" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="260" cy="400" r="8" fill="#0f766e"/>
  <circle cx="780" cy="400" r="8" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1250" cy="400" r="8" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1420" cy="400" r="8" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
  <text x="640" y="378" font-size="12.5" fill="#0f766e">④ 合进 develop</text>
  <text x="1258" y="384" font-size="11.5" fill="#15803d">合回 develop</text>

  <line x1="320" y1="400" x2="320" y2="520" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="48" y="527" font-size="17" font-weight="700" fill="#7c3aed">feature/x</text>
  <line x1="320" y1="520" x2="780" y2="520" stroke="#ddd6fe" stroke-width="3"/>
  <circle cx="320" cy="520" r="8" fill="#7c3aed"/><circle cx="520" cy="520" r="7" fill="#a78bfa"/><circle cx="780" cy="520" r="8" fill="#7c3aed"/>
  <path d="M780,512 L780,412" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#f2v)"/>
  <text x="330" y="502" font-size="12.5" fill="#7c3aed">① 从 develop 切出</text>
  <text x="480" y="558" font-size="12.5" fill="#7c3aed">② 提交（本地为主）</text>
  <text x="650" y="502" font-size="12.5" fill="#7c3aed">③ 评审</text>

  <line x1="900" y1="400" x2="900" y2="650" stroke="#bbf7d0" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="48" y="657" font-size="17" font-weight="700" fill="#16a34a">release/1.0</text>
  <line x1="900" y1="650" x2="1250" y2="650" stroke="#bbf7d0" stroke-width="3"/>
  <circle cx="900" cy="650" r="8" fill="#16a34a"/><circle cx="1150" cy="650" r="8" fill="#16a34a"/><circle cx="1250" cy="650" r="8" fill="#16a34a"/>
  <path d="M1150,642 L1150,192" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#f2g)"/>
  <path d="M1250,642 L1250,412" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#f2g)"/>
  <text x="912" y="688" font-size="12.5" fill="#15803d">⑤ 切 release 冻结版本</text>
  <text x="960" y="620" font-size="12.5" fill="#15803d">⑥ 合 main（打 tag）</text>

  <rect x="48" y="730" width="1400" height="104" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="72" y="762" font-size="15.5" font-weight="700" fill="#9a3412">★ 三类辅助分支可以同时存在 —— 但都汇到 develop</text>
  <text x="72" y="790" font-size="13" fill="#7c2d12">feature（做功能）· release（冻结发布）· hotfix（线上救火）是三种不同的活，可以同时在跑；并行度靠「分支多」换来，代价是合并面最大。</text>
  <text x="72" y="814" font-size="13" fill="#7c2d12">而且它的兜底几乎全是软纪律：CI 出现之前，靠的是评审习惯 + release manager 的人工协调 —— 机器几乎不拦。</text>

  <rect x="48" y="852" width="14" height="14" rx="3" fill="#dc2626"/><text x="70" y="864" font-size="12.5" fill="#475569">硬 · 平台 / 门禁</text>
  <rect x="240" y="852" width="14" height="14" rx="3" fill="#d97706"/><text x="262" y="864" font-size="12.5" fill="#475569">半硬 · 本地 hook</text>
  <rect x="452" y="852" width="14" height="14" rx="3" fill="#64748b"/><text x="474" y="864" font-size="12.5" fill="#475569">软 · 纯纪律（Git Flow 的主要兜底）</text>

  <rect x="42" y="876" width="163" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="58" y="908" font-size="13" font-weight="700" fill="#334155">① 切 feature</text>
  <text x="58" y="932" font-size="11.5" fill="#64748b">软 · 从 develop 切</text>
  <text x="58" y="954" font-size="11" fill="#94a3b8">不碰 main</text>

  <rect x="221" y="876" width="163" height="110" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="237" y="908" font-size="13" font-weight="700" fill="#92400e">② 提交</text>
  <text x="237" y="932" font-size="11.5" fill="#b45309">半硬 · 本地 hook</text>
  <text x="237" y="954" font-size="11" fill="#a16207">pre-commit</text>

  <rect x="400" y="876" width="163" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="416" y="908" font-size="13" font-weight="700" fill="#334155">③ 评审</text>
  <text x="416" y="932" font-size="11.5" fill="#64748b">软 · 评审习惯</text>
  <text x="416" y="954" font-size="11" fill="#94a3b8">谁审、审到什么程度</text>

  <rect x="579" y="876" width="163" height="110" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="595" y="908" font-size="13" font-weight="700" fill="#b91c1c">④ 合 develop</text>
  <text x="595" y="932" font-size="11.5" fill="#dc2626">硬（若用平台）</text>
  <text x="595" y="954" font-size="11" fill="#b91c1c">分支保护 / MR 批准</text>

  <rect x="758" y="876" width="163" height="110" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="774" y="908" font-size="13" font-weight="700" fill="#92400e">⑤ 切 release</text>
  <text x="774" y="932" font-size="11.5" fill="#b45309">软 · 冻结决议</text>
  <text x="774" y="954" font-size="11" fill="#a16207">谁决定「可以发了」</text>

  <rect x="937" y="876" width="163" height="110" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="953" y="908" font-size="13" font-weight="700" fill="#92400e">⑥ 合 main</text>
  <text x="953" y="932" font-size="11.5" fill="#b45309">软 · release manager</text>
  <text x="953" y="954" font-size="11" fill="#a16207">打 tag 的时机</text>

  <rect x="1116" y="876" width="163" height="110" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="1132" y="908" font-size="13" font-weight="700" fill="#92400e">⑦ hotfix</text>
  <text x="1132" y="932" font-size="11.5" fill="#b45309">软 · 事故流程</text>
  <text x="1132" y="954" font-size="11" fill="#a16207">从 main 切</text>

  <rect x="1295" y="876" width="163" height="110" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1311" y="908" font-size="13" font-weight="700" fill="#b91c1c">⑧ 合两处</text>
  <text x="1311" y="932" font-size="11.5" fill="#dc2626">软 · ★ 最容易漏</text>
  <text x="1311" y="954" font-size="11" fill="#b91c1c">main + develop 都要合</text>
</svg>
