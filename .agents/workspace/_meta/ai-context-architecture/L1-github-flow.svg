<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="1400" height="770" fill="#ffffff"/>
  <text x="48" y="54" font-size="27" font-weight="700" fill="#0f172a">GitHub Flow（经典）</text>
  <rect x="1152" y="28" width="200" height="30" rx="15" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="1252" y="49" font-size="13" fill="#4338ca" text-anchor="middle">Layer 1 · 分支策略</text>
  <text x="48" y="86" font-size="15" fill="#64748b">单一常驻主干 ＋ 短命分支 ＋ Pull Request ｜ 合并进 main 即部署</text>

  <defs>
    <marker id="a1v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <text x="48" y="237" font-size="18" font-weight="700" fill="#1d4ed8">main</text>
  <text x="48" y="257" font-size="12" fill="#94a3b8">唯一长期分支 · 永远可部署</text>
  <line x1="200" y1="230" x2="1068" y2="230" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M1068,224 L1080,230 L1068,236 z" fill="#2563eb"/>
  <circle cx="300" cy="230" r="8" fill="#2563eb"/>
  <circle cx="1040" cy="230" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <text x="300" y="206" font-size="12" fill="#64748b">从 main 切出</text>
  <rect x="1080" y="214" width="156" height="32" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="1158" y="235" font-size="12.5" fill="#15803d" text-anchor="middle">deploy from main</text>

  <line x1="300" y1="230" x2="300" y2="380" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="48" y="387" font-size="17" font-weight="700" fill="#7c3aed">feature/x</text>
  <text x="48" y="407" font-size="12" fill="#94a3b8">短命分支 · 合并后即删</text>
  <line x1="300" y1="380" x2="900" y2="380" stroke="#ddd6fe" stroke-width="3"/>
  <circle cx="300" cy="380" r="8" fill="#7c3aed"/><circle cx="500" cy="380" r="7" fill="#a78bfa"/>
  <circle cx="700" cy="380" r="7" fill="#a78bfa"/><circle cx="900" cy="380" r="8" fill="#7c3aed"/>
  <path d="M900,372 Q962,230 1032,230" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#a1v)"/>
  <text x="600" y="360" font-size="12.5" fill="#7c3aed">Push ＋ Pull Request（评审在这里发生）</text>

  <text x="80" y="486" font-size="15" font-weight="700" fill="#0f172a">一次改动：六步</text>
  <rect x="80" y="502" width="180" height="66" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="98" y="530" font-size="13.5" font-weight="600" fill="#5b21b6">① 切分支</text>
  <text x="98" y="552" font-size="11.5" fill="#7c3aed">Create a branch</text>
  <rect x="280" y="502" width="180" height="66" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="298" y="530" font-size="13.5" font-weight="600" fill="#5b21b6">② 改代码并提交</text>
  <text x="298" y="552" font-size="11.5" fill="#7c3aed">Make changes</text>
  <rect x="480" y="502" width="180" height="66" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="498" y="530" font-size="13.5" font-weight="600" fill="#5b21b6">③ 开 Pull Request</text>
  <text x="498" y="552" font-size="11.5" fill="#7c3aed">Create a PR</text>
  <rect x="680" y="502" width="180" height="66" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="698" y="530" font-size="13.5" font-weight="600" fill="#5b21b6">④ 按评审意见改</text>
  <text x="698" y="552" font-size="11.5" fill="#7c3aed">Address comments</text>
  <rect x="880" y="502" width="180" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="898" y="530" font-size="13.5" font-weight="600" fill="#166534">⑤ 合并进 main</text>
  <text x="898" y="552" font-size="11.5" fill="#15803d">Merge the PR</text>
  <rect x="1080" y="502" width="180" height="66" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1098" y="530" font-size="13.5" font-weight="600" fill="#166534">⑥ 删除分支</text>
  <text x="1098" y="552" font-size="11.5" fill="#15803d">Delete the branch</text>

  <rect x="80" y="602" width="1180" height="160" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="100" y="634" font-size="15" font-weight="700" fill="#0f172a">四条约定（经典口径）</text>
  <text x="100" y="662" font-size="13" fill="#334155">· 只有 main 是长期分支；功能分支短命（小时到几天），合并后立即删除</text>
  <text x="100" y="686" font-size="13" fill="#334155">· main 任何时刻都是可部署状态 —— 部署从 main 出发，不从分支出发</text>
  <text x="100" y="710" font-size="13" fill="#334155">· 一切改动经 Pull Request：评审、讨论、检查都发生在 PR 里，合并即发布</text>
  <text x="100" y="734" font-size="13" fill="#334155">· 不设 develop、不设 release 分支 —— 不为「多版本并行维护」设计</text>
  <text x="100" y="752" font-size="11.5" fill="#94a3b8">出处：GitHub 官方文档 · GitHub flow（docs.github.com/en/get-started/using-github/github-flow）</text>
</svg>
