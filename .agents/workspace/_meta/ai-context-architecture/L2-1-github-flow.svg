<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="1500" height="880" fill="#ffffff"/>
  <text x="48" y="52" font-size="27" font-weight="700" fill="#0f172a">Layer 2 · GitHub Flow 的流</text>
  <text x="48" y="84" font-size="15" fill="#64748b">沿用 L1 的分支线条 —— 一次改动从切分支到上线；主干从不停，改动一茬接一茬</text>

  <defs>
    <marker id="g2v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <text x="48" y="232" font-size="18" font-weight="700" fill="#1d4ed8">main</text>
  <text x="48" y="252" font-size="11.5" fill="#94a3b8">唯一常驻 · 永远可部署</text>
  <line x1="200" y1="226" x2="1420" y2="226" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="260" cy="226" r="8" fill="#2563eb"/>
  <circle cx="800" cy="226" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1100" cy="226" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <text x="200" y="206" font-size="12.5" fill="#1d4ed8">① 从 main 切分支</text>
  <text x="734" y="206" font-size="12.5" fill="#1d4ed8">④ 合并进 main</text>
  <text x="1034" y="206" font-size="12.5" fill="#1d4ed8">④ 合并进 main</text>
  <rect x="822" y="248" width="94" height="30" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="869" y="268" font-size="12" fill="#15803d" text-anchor="middle">⑤ 部署</text>
  <rect x="1122" y="248" width="94" height="30" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="1169" y="268" font-size="12" fill="#15803d" text-anchor="middle">⑤ 部署</text>

  <line x1="260" y1="226" x2="260" y2="366" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="48" y="372" font-size="17" font-weight="700" fill="#7c3aed">feature/A</text>
  <text x="48" y="392" font-size="11.5" fill="#94a3b8">短命 · 合并后即删</text>
  <line x1="260" y1="366" x2="800" y2="366" stroke="#ddd6fe" stroke-width="3"/>
  <circle cx="260" cy="366" r="8" fill="#7c3aed"/><circle cx="480" cy="366" r="7" fill="#a78bfa"/>
  <circle cx="700" cy="366" r="7" fill="#a78bfa"/><circle cx="800" cy="366" r="8" fill="#7c3aed"/>
  <path d="M800,358 L800,238" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#g2v)"/>
  <text x="410" y="346" font-size="12.5" fill="#7c3aed">② 提交 + push（本地）</text>
  <text x="620" y="346" font-size="12.5" fill="#7c3aed">③ 开 PR · 评审</text>
  <line x1="800" y1="366" x2="884" y2="366" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="890" y="371" font-size="11.5" fill="#94a3b8">⑥ 删除分支</text>

  <line x1="640" y1="226" x2="640" y2="466" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="48" y="472" font-size="17" font-weight="700" fill="#7c3aed">feature/B</text>
  <text x="48" y="492" font-size="11.5" fill="#94a3b8">★ 同时进行</text>
  <line x1="640" y1="466" x2="1100" y2="466" stroke="#ddd6fe" stroke-width="3"/>
  <circle cx="640" cy="466" r="8" fill="#7c3aed"/><circle cx="900" cy="466" r="7" fill="#a78bfa"/><circle cx="1100" cy="466" r="8" fill="#7c3aed"/>
  <path d="M1100,458 L1100,238" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#g2v)"/>

  <rect x="48" y="546" width="1400" height="118" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="72" y="580" font-size="15.5" font-weight="700" fill="#b45309">★ 什么叫「流」：主干从不等</text>
  <text x="72" y="610" font-size="13" fill="#78350f">A 还没合进 main，B 线已经开工 —— 改动一茬接一茬，主干永远处于可部署状态。</text>
  <text x="72" y="634" font-size="13" fill="#78350f">并行的单位就是这两条短命分支：各自一份工作区、互不可见；合流点只有一个 —— main。</text>
  <text x="72" y="656" font-size="12.5" fill="#a16207">代价：两条线改到同一个文件就会撞车 —— 所以 GitHub Flow 靠「分支短命」把撞车窗口压到最小。</text>

  <rect x="48" y="692" width="14" height="14" rx="3" fill="#dc2626"/><text x="70" y="704" font-size="12.5" fill="#475569">硬 · 平台或门禁兜底</text>
  <rect x="248" y="692" width="14" height="14" rx="3" fill="#d97706"/><text x="270" y="704" font-size="12.5" fill="#475569">半硬 · 本地 hook（可绕过）</text>
  <rect x="500" y="692" width="14" height="14" rx="3" fill="#64748b"/><text x="522" y="704" font-size="12.5" fill="#475569">软 · 纯纪律</text>

  <rect x="40" y="716" width="220" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="748" font-size="13.5" font-weight="700" fill="#334155">① 切分支</text>
  <text x="60" y="774" font-size="12" fill="#64748b">软 · 纪律</text>
  <text x="60" y="796" font-size="11.5" fill="#94a3b8">命名约定 feat / fix</text>

  <rect x="280" y="716" width="220" height="110" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="300" y="748" font-size="13.5" font-weight="700" fill="#92400e">② 提交</text>
  <text x="300" y="774" font-size="12" fill="#b45309">半硬 · 本地 hook</text>
  <text x="300" y="796" font-size="11.5" fill="#a16207">pre-commit 检查</text>

  <rect x="520" y="716" width="220" height="110" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="540" y="748" font-size="13.5" font-weight="700" fill="#b91c1c">③ 审阅</text>
  <text x="540" y="774" font-size="12" fill="#dc2626">硬 · 平台</text>
  <text x="540" y="796" font-size="11.5" fill="#b91c1c">必须批准 + 检查必须绿</text>

  <rect x="760" y="716" width="220" height="110" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="780" y="748" font-size="13.5" font-weight="700" fill="#b91c1c">④ 合流</text>
  <text x="780" y="774" font-size="12" fill="#dc2626">硬 · 平台</text>
  <text x="780" y="796" font-size="11.5" fill="#b91c1c">分支保护 · 禁直推主干</text>

  <rect x="1000" y="716" width="220" height="110" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1020" y="748" font-size="13.5" font-weight="700" fill="#b91c1c">⑤ 部署</text>
  <text x="1020" y="774" font-size="12" fill="#dc2626">硬 · 部署门禁</text>
  <text x="1020" y="796" font-size="11.5" fill="#b91c1c">部署前检查 / 回滚预案</text>

  <rect x="1240" y="716" width="220" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1260" y="748" font-size="13.5" font-weight="700" fill="#334155">⑥ 删除分支</text>
  <text x="1260" y="774" font-size="12" fill="#64748b">软 · 纪律</text>
  <text x="1260" y="796" font-size="11.5" fill="#94a3b8">合并后即删（平台多会提示）</text>
</svg>
