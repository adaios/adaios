<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="1500" height="950" fill="#ffffff"/>
  <text x="48" y="52" font-size="27" font-weight="700" fill="#0f172a">Layer 2 · 并行与隔离：多条线同时跑</text>
  <text x="48" y="84" font-size="15" fill="#64748b">隔离的粒度 ＝ 工作区 / 检出 / 索引；共享的面 ＝ 远端仓库 / CI / 发布出口 / 共享文件</text>

  <rect x="60" y="120" width="430" height="118" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="80" y="152" font-size="15" font-weight="700" fill="#1e3a8a">线 A · 工作区 1</text>
  <text x="80" y="180" font-size="12.5" fill="#1d4ed8">分支 feat/xxx · 进行中</text>
  <text x="80" y="204" font-size="12" fill="#64748b">自己的文件副本 · 自己的检出</text>
  <text x="80" y="224" font-size="12" fill="#64748b">未提交改动只在这里可见</text>

  <rect x="535" y="120" width="430" height="118" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="555" y="152" font-size="15" font-weight="700" fill="#5b21b6">线 B · 工作区 2</text>
  <text x="555" y="180" font-size="12.5" fill="#6d28d9">分支 feat/yyy · 进行中</text>
  <text x="555" y="204" font-size="12" fill="#64748b">与线 A 互不可见</text>
  <text x="555" y="224" font-size="12" fill="#64748b">同一个仓库、另一份检出</text>

  <rect x="1010" y="120" width="430" height="118" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1030" y="152" font-size="15" font-weight="700" fill="#166534">线 C · 工作区 3</text>
  <text x="1030" y="180" font-size="12.5" fill="#15803d">分支 fix/zzz · 进行中</text>
  <text x="1030" y="204" font-size="12" fill="#64748b">三条线同时进行</text>
  <text x="1030" y="224" font-size="12" fill="#64748b">并行度越高，合并成本越高</text>

  <rect x="60" y="258" width="1380" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="288" font-size="13" fill="#334155">共用同一个远端仓库（唯一汇合点）　·　每条线只在自己那份检出上工作 —— 隔离是「本地实现」，共享是「远端事实」</text>

  <rect x="60" y="330" width="670" height="230" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="80" y="364" font-size="16" font-weight="700" fill="#0369a1">每个工作区独占（隔离面）</text>
  <text x="80" y="398" font-size="13" fill="#0c4a6e">· 工作区目录 —— 各自一份完整文件</text>
  <text x="80" y="426" font-size="13" fill="#0c4a6e">· 检出 HEAD —— 各自指向自己的分支</text>
  <text x="80" y="454" font-size="13" fill="#0c4a6e">· 本地索引（暂存区）—— 各自一套</text>
  <text x="80" y="482" font-size="13" fill="#0c4a6e">· 未提交改动 —— 互不可见</text>
  <text x="80" y="518" font-size="12" fill="#0284c7">关键收益：一条线改坏，不影响另一条线继续跑</text>
  <text x="80" y="542" font-size="12" fill="#0284c7">（实验、试错、并行探索都靠这条隔离带）</text>

  <rect x="770" y="330" width="670" height="230" rx="12" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="790" y="364" font-size="16" font-weight="700" fill="#7e22ce">所有线共用（共享面）</text>
  <text x="790" y="398" font-size="13" fill="#581c87">· 远端仓库 —— 唯一真相与唯一汇合点</text>
  <text x="790" y="426" font-size="13" fill="#581c87">· CI / 干净检出 —— 唯一可信的验证环境</text>
  <text x="790" y="454" font-size="13" fill="#581c87">· 发布出口 —— 构建产物、线上环境</text>
  <text x="790" y="482" font-size="13" fill="#581c87">· 共享文件 —— 变更日志 / 索引 / 状态 / 版本号</text>
  <text x="790" y="518" font-size="12" fill="#7e22ce">共享面 = 冲突与污染的来源：越靠近它越要串行</text>

  <text x="60" y="606" font-size="17" font-weight="700" fill="#0f172a">三条污染路径 —— 并行真正的代价在这儿</text>

  <rect x="60" y="626" width="430" height="180" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="80" y="658" font-size="14.5" font-weight="700" fill="#b91c1c">污染一 · 本地构建污染</text>
  <text x="80" y="686" font-size="12.5" fill="#7f1d1d">症状：本地全过，CI 挂了</text>
  <text x="80" y="710" font-size="12.5" fill="#7f1d1d">原因：构建产物 / 缓存夹带了</text>
  <text x="80" y="730" font-size="12.5" fill="#7f1d1d">　　　另一条线的未完成改动</text>
  <text x="80" y="760" font-size="12.5" font-weight="600" fill="#b91c1c">对策：把 CI 的干净检出</text>
  <text x="80" y="780" font-size="12.5" font-weight="600" fill="#b91c1c">　　　当作唯一可信验证</text>

  <rect x="535" y="626" width="430" height="180" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="555" y="658" font-size="14.5" font-weight="700" fill="#b91c1c">污染二 · 共享文件撞车</text>
  <text x="555" y="686" font-size="12.5" fill="#7f1d1d">症状：每次合都在同一处打架</text>
  <text x="555" y="710" font-size="12.5" fill="#7f1d1d">原因：多条线同时改「账本类」文件</text>
  <text x="555" y="730" font-size="12.5" fill="#7f1d1d">　　　（变更日志 / 索引 / 状态 / 清单）</text>
  <text x="555" y="760" font-size="12.5" font-weight="600" fill="#b91c1c">对策：同一时间只让一条线写；</text>
  <text x="555" y="780" font-size="12.5" font-weight="600" fill="#b91c1c">　　　合的时候取并集，不二选一</text>

  <rect x="1010" y="626" width="430" height="180" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1030" y="658" font-size="14.5" font-weight="700" fill="#b91c1c">污染三 · 晚合并放大冲突</text>
  <text x="1030" y="686" font-size="12.5" fill="#7f1d1d">症状：分支放久了，冲突成倍长</text>
  <text x="1030" y="710" font-size="12.5" fill="#7f1d1d">原因：冲突面随时间增长，</text>
  <text x="1030" y="730" font-size="12.5" fill="#7f1d1d">　　　主干越往前走越难追</text>
  <text x="1030" y="760" font-size="12.5" font-weight="600" fill="#b91c1c">对策：分支寿命压短；</text>
  <text x="1030" y="780" font-size="12.5" font-weight="600" fill="#b91c1c">　　　定期把主干合回分支</text>

  <rect x="60" y="820" width="1380" height="126" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="858" font-size="14.5" font-weight="700" fill="#0f172a">三种模型下的并行形态</text>
  <text x="80" y="884" font-size="13" fill="#334155">· <tspan font-weight="600" fill="#1d4ed8">GitHub Flow</tspan>：并行单位 ＝ 短命分支 → 冲突窗口本来就小；主干靠分支保护不许直推</text>
  <text x="80" y="908" font-size="13" fill="#334155">· <tspan font-weight="600" fill="#15803d">GitLab Flow</tspan>：并行仍是分支，但<tspan font-weight="600" fill="#0f172a">环境是串行闸门</tspan>（只有一个 production）→ 天然不允许并行推进</text>
  <text x="80" y="932" font-size="13" fill="#334155">· <tspan font-weight="600" fill="#b45309">Git Flow</tspan>：feature / release / hotfix <tspan font-weight="600" fill="#0f172a">三类同时存在</tspan>，全都汇到 develop → 冲突面最大，靠人工协调兜底</text>
</svg>
