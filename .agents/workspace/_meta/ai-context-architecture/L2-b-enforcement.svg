  <text x="1164" y="240" font-size="12" fill="#cbd5e1" text-anchor="middle">—</text>
  <rect x="1270" y="190" width="148" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1344" y="240" font-size="12" fill="#cbd5e1" text-anchor="middle">—</text>

  <text x="40" y="380" font-size="14" font-weight="700" fill="#b91c1c">平台服务端</text>
  <text x="40" y="400" font-size="11" fill="#94a3b8">远端策略 · 绕不过</text>
  <rect x="190" y="330" width="148" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="264" y="366" font-size="11.5" fill="#7f1d1d" text-anchor="middle">分支命名规则</text>
  <text x="264" y="386" font-size="11.5" fill="#7f1d1d" text-anchor="middle">（可配强制）</text>
  <rect x="370" y="330" width="148" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="444" y="366" font-size="11.5" fill="#7f1d1d" text-anchor="middle">push rules</text>
  <text x="444" y="386" font-size="11.5" fill="#7f1d1d" text-anchor="middle">提交信息 / 大文件</text>
  <rect x="550" y="330" width="148" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="624" y="362" font-size="11.5" fill="#7f1d1d" text-anchor="middle">必须 N 人批准</text>
  <text x="624" y="382" font-size="11.5" fill="#7f1d1d" text-anchor="middle">+ pipeline 必须绿</text>
  <text x="624" y="402" font-size="11.5" fill="#7f1d1d" text-anchor="middle">+ 冲突已解决</text>
  <rect x="730" y="330" width="148" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="804" y="366" font-size="11.5" fill="#7f1d1d" text-anchor="middle">protected branch</text>
  <text x="804" y="386" font-size="11.5" fill="#7f1d1d" text-anchor="middle">禁直推 · 禁强推</text>
  <rect x="910" y="330" width="148" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="984" y="366" font-size="11.5" fill="#7f1d1d" text-anchor="middle">protected</text>
