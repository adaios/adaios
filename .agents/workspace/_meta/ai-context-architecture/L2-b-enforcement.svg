<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="1500" height="860" fill="#ffffff"/>
  <text x="48" y="52" font-size="27" font-weight="700" fill="#0f172a">Layer 2 · 强制力落点：哪一步真的拦得住</text>
  <text x="48" y="84" font-size="15" fill="#64748b">同一个环节可以有几层保障；越靠下越硬 —— 判断一句话：这条规则能不能被一次 --no-verify 或一次网页点击绕过？</text>

  <rect x="48" y="104" width="14" height="14" rx="3" fill="#dc2626"/><text x="70" y="116" font-size="12.5" fill="#475569">硬 · 服务端 / 门禁（绕不过）</text>
  <rect x="248" y="104" width="14" height="14" rx="3" fill="#d97706"/><text x="270" y="116" font-size="12.5" fill="#475569">半硬 · 本地 hook（可 --no-verify）</text>
  <rect x="500" y="104" width="14" height="14" rx="3" fill="#64748b"/><text x="522" y="116" font-size="12.5" fill="#475569">软 · 纯纪律（机器不拦）</text>

  <text x="264" y="156" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">① 切分支</text>
  <text x="444" y="156" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">② 开发提交</text>
  <text x="624" y="156" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">③ 审阅</text>
  <text x="804" y="156" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">④ 合流</text>
  <text x="984" y="156" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">⑤ 发布</text>
  <text x="1164" y="156" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">⑥ 上线</text>
  <text x="1344" y="156" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">⑦ 异常回流</text>

  <text x="40" y="240" font-size="14" font-weight="700" fill="#b45309">本地 hook</text>
  <text x="40" y="260" font-size="11" fill="#94a3b8">开发者机器上</text>
