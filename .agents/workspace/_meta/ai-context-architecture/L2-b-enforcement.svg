  <text x="444" y="520" font-size="12" fill="#cbd5e1" text-anchor="middle">—</text>
  <rect x="550" y="470" width="148" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="624" y="520" font-size="12" fill="#cbd5e1" text-anchor="middle">—</text>
  <rect x="730" y="470" width="148" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="804" y="520" font-size="12" fill="#cbd5e1" text-anchor="middle">—</text>
  <rect x="910" y="470" width="148" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="984" y="506" font-size="11.5" fill="#7f1d1d" text-anchor="middle">发布审批</text>
  <text x="984" y="526" font-size="11.5" fill="#7f1d1d" text-anchor="middle">（走不走这一步）</text>
  <rect x="1090" y="470" width="148" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1164" y="506" font-size="11.5" fill="#7f1d1d" text-anchor="middle">部署前检查</text>
  <text x="1164" y="526" font-size="11.5" fill="#7f1d1d" text-anchor="middle">构建 / 测试 / 回滚</text>
  <rect x="1270" y="470" width="148" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1344" y="520" font-size="12" fill="#cbd5e1" text-anchor="middle">—</text>

  <text x="40" y="660" font-size="14" font-weight="700" fill="#475569">纪律（软）</text>
  <text x="40" y="680" font-size="11" fill="#94a3b8">没人替你记</text>
  <rect x="190" y="610" width="148" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="264" y="646" font-size="11.5" fill="#475569" text-anchor="middle">命名约定</text>
  <text x="264" y="666" font-size="11.5" fill="#475569" text-anchor="middle">feat / fix / …</text>
  <rect x="370" y="610" width="148" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="444" y="646" font-size="11.5" fill="#475569" text-anchor="middle">一次提交</text>
  <text x="444" y="666" font-size="11.5" fill="#475569" text-anchor="middle">只做一件事</text>
  <rect x="550" y="610" width="148" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="624" y="646" font-size="11.5" fill="#475569" text-anchor="middle">谁审 · 审到什么</text>
  <text x="624" y="666" font-size="11.5" fill="#475569" text-anchor="middle">程度算过</text>
  <rect x="730" y="610" width="148" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="804" y="656" font-size="11.5" fill="#475569" text-anchor="middle">谁能合</text>
  <rect x="910" y="610" width="148" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="984" y="656" font-size="11.5" fill="#475569" text-anchor="middle">何时该发</text>
  <rect x="1090" y="610" width="148" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1164" y="656" font-size="11.5" fill="#475569" text-anchor="middle">发布窗口</text>
  <rect x="1270" y="610" width="148" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1344" y="642" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">「热修必须先</text>
  <text x="1344" y="662" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">修主干」</text>
  <text x="1344" y="684" font-size="10.5" fill="#b91c1c" text-anchor="middle">★ 最纯的纪律</text>

  <rect x="40" y="730" width="1420" height="106" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="762" font-size="14.5" font-weight="700" fill="#0f172a">三种模型对「强制力从哪来」的假设完全不同</text>
  <text x="64" y="790" font-size="13" fill="#334155">· <tspan font-weight="600" fill="#b45309">Git Flow</tspan> 诞生于 CI 出现之前 —— 它的保障基本是<tspan font-weight="600" fill="#0f172a">纪律 + release manager 的人工协调</tspan>，机器几乎不拦</text>
  <text x="64" y="814" font-size="13" fill="#334155">· <tspan font-weight="600" fill="#1d4ed8">GitHub Flow</tspan> 假设<tspan font-weight="600" fill="#0f172a">平台兜底</tspan>：分支保护 + 必须评审 + 检查必须绿，所以它敢只留一条主干</text>
  <text x="64" y="838" font-size="13" fill="#334155">· <tspan font-weight="600" fill="#15803d">GitLab Flow</tspan> 把闸门再下沉一层到<tspan font-weight="600" fill="#0f172a">环境</tspan>：代码能合进主干，不等于能进生产 —— 环境本身受保护</text>
</svg>
