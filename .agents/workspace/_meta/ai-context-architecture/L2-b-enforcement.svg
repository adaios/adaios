  <text x="1344" y="380" font-size="12" fill="#cbd5e1" text-anchor="middle">—</text>

  <text x="40" y="520" font-size="14" font-weight="700" fill="#b91c1c">部署门禁</text>
  <text x="40" y="540" font-size="11" fill="#94a3b8">部署动作上</text>
  <rect x="190" y="470" width="148" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="264" y="520" font-size="12" fill="#cbd5e1" text-anchor="middle">—</text>
